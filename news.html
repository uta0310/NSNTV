<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ニュース | NSNテレビ</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="site-header">

        <div class="header-inner">

            <a href="index.html" class="logo">
                NSNテレビ
            </a>

            <nav class="main-nav">
                <a href="programs.html">番組</a>
                <a href="news.html" class="active">ニュース</a>
                <a href="#">放送予定</a>
                <a href="#">アナウンサー</a>
                <a href="#">NSNテレビについて</a>
            </nav>

        </div>

    </header>


    <main>

        <section class="page-header">

            <div class="section-inner">

                <p class="section-label">NEWS</p>

                <h1>ニュース</h1>

                <p>
                    NSNテレビからのお知らせや最新情報をご紹介します。
                </p>

            </div>

        </section>


        <section class="news">

            <div class="section-inner">

            <div class="news-list" id="news-list">

</div>    

            </div>

        </section>

    </main>


    <footer class="site-footer">

        <div class="footer-inner">

            <div class="footer-main">

                <a href="index.html" class="footer-logo">
    NSNテレビ
</a>

                <p class="footer-description">
                    NSNテレビ公式サイト
                </p>

            </div>


            <nav class="footer-nav">

                <a href="programs.html">番組</a>
                <a href="news.html">ニュース</a>
                <a href="#">放送予定</a>
                <a href="#">アナウンサー</a>
                <a href="#">NSNテレビについて</a>

            </nav>

        </div>


        <div class="footer-bottom">

            <p>
                © NSNテレビ All Rights Reserved.
            </p>

        </div>

    </footer>

<script>
    fetch("news/news.json")
        .then(response => response.json())
        .then(data => {

            const newsList = document.getElementById("news-list");

            data.items.forEach(news => {

                const item = document.createElement("a");

                item.href = "news-detail.html?id=" + data.items.indexOf(news);
                item.className = "news-item";

                const date = new Date(news.date);

                const formattedDate =
                    date.getFullYear() + "." +
                    String(date.getMonth() + 1).padStart(2, "0") + "." +
                    String(date.getDate()).padStart(2, "0");

                item.innerHTML = `
                    <time datetime="${news.date}">
                        ${formattedDate}
                    </time>

                    <span class="news-category">
                        ${news.category}
                    </span>

                    <p>
                        ${news.title}
                    </p>
                `;

                newsList.appendChild(item);

            });

        })
        .catch(error => {
            console.error("ニュースの読み込みに失敗しました:", error);
        });
</script>

</body>

</html>
