<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ニュース記事 | NSNテレビ</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="site-header">

        <div class="header-inner">

            <a href="index.html" class="logo">
                NSNテレビ
            </a>

            <nav class="main-nav">
                <a href="programs.html">番組</a>
                <a href="news.html" class="active">ニュース</a>
                <a href="schedule.html">放送予定</a>
                <a href="announcers.html">アナウンサー</a>
                <a href="about.html">NSNテレビについて</a>
            </nav>

        </div>

    </header>


    <main>

    <article class="news-detail">

        <div class="section-inner">

            <p class="section-label">
                NEWS
            </p>

            <time id="news-date"></time>

            <h1 id="news-title"></h1>

            <p class="news-detail-lead" id="news-lead"></p>

            <div class="news-detail-image">
                <img src="img_2103.jpg" alt="ニュース画像">
            </div>

            <div class="news-detail-content" id="news-content">
            </div>

            <a href="news.html" class="news-back">
                ← ニュース一覧に戻る
            </a>

        </div>

    </article>

</main>


    <footer class="site-footer">

        <div class="footer-inner">

            <div class="footer-main">

                <a href="index.html" class="footer-logo">
                    NSNテレビ
                </a>

                <p class="footer-description">
                    NSNテレビ公式サイト
                </p>

            </div>


            <nav class="footer-nav">

                <a href="programs.html">番組</a>
                <a href="news.html">ニュース</a>
                <a href="schedule.html">放送予定</a>
                <a href="announcers.html">アナウンサー</a>
                <a href="about.html">NSNテレビについて</a>

            </nav>

        </div>


        <div class="footer-bottom">

            <p>
                © NSNテレビ All Rights Reserved.
            </p>

        </div>

    </footer>

<script>
    const params = new URLSearchParams(window.location.search);
    const newsId = Number(params.get("id"));

    fetch("news/news.json")
        .then(response => response.json())
        .then(data => {

            const news = data.items[newsId];

            if (!news) {
                document.getElementById("news-title").textContent = "ニュースが見つかりません";
                return;
            }

            const date = new Date(news.date);

            const formattedDate =
                date.getFullYear() + "." +
                String(date.getMonth() + 1).padStart(2, "0") + "." +
                String(date.getDate()).padStart(2, "0");

            document.getElementById("news-date").textContent = formattedDate;
            document.getElementById("news-title").textContent = news.title;
            document.getElementById("news-lead").textContent = news.title;

            document.getElementById("news-content").innerHTML =
                "<p>" + news.body + "</p>";

        })
        .catch(error => {
            console.error("ニュースの読み込みに失敗しました:", error);
        });
</script>

</body>

</html>
